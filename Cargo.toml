[package]
name = "mewiki"
version = "0.1.0"
edition = "2024"
description = "A personal, self-hosted wiki that keeps its pages as Markdown files on disk"
publish = false

[dependencies]
askama = "0.16"
axum = "0.8"
comrak = { version = "0.55", default-features = false, features = ["syntect-fancy"] }
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
